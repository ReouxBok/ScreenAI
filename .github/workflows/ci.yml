name: Limova CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            proxy/package-lock.json
            studio/package-lock.json
      - run: npm ci
      - run: npm ci --prefix proxy
      - run: npm ci --prefix studio
      - run: node scripts/package-braces-remediation.mjs --check
      - run: node scripts/audit-dependencies.mjs
      - run: node scripts/audit-dependencies.mjs proxy
      - run: node scripts/audit-dependencies.mjs studio
      - run: npm test
      - run: npm run typecheck --prefix studio
      - run: npm run lint --prefix studio
      - run: npm run db:generate --prefix studio -- --name ci_schema_check
      - run: git diff --exit-code -- studio/drizzle
      - run: npm test --prefix studio
      - run: npm run sav:replay --prefix studio -- --technical-preflight
      - run: npm test --prefix proxy
      - run: npm run build --prefix studio
      - run: npx playwright install --with-deps chromium
      - name: Studio browser tests in isolated processes
        run: |
          node --test studio/scripts/run-e2e-ci.node-test.mjs
          node studio/scripts/run-e2e-ci.mjs
      - name: Preserve Studio browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-browser-diagnostics
          path: studio/test-results
          if-no-files-found: warn
          retention-days: 7
      - run: env -i PATH="$PATH" HOME="$HOME" CI=1 npm run test:e2e --prefix studio -- --config playwright.sav-semantic.config.ts
      - run: env -i PATH="$PATH" HOME="$HOME" CI=1 npm run test:e2e --prefix studio -- --config playwright.sav-journey.config.ts
      - run: env -i PATH="$PATH" HOME="$HOME" CI=1 npm run test:e2e --prefix studio -- --config playwright.sav-other.config.ts
      - run: env -i PATH="$PATH" HOME="$HOME" CI=1 npm run test:e2e --prefix studio -- --config playwright.sav73.config.ts
      - run: env -i PATH="$PATH" HOME="$HOME" CI=1 npm run test:e2e --prefix studio -- --config playwright.sav83.config.ts
      - run: npm run test:e2e
      - run: npm run validate:package
      - uses: actions/upload-artifact@v4
        with:
          name: limova-ai-extension-2.2.49
          path: |
            dist/limova-ai-extension-2.2.49.zip
            dist/limova-ai-extension-2.2.49.zip.sha256
          if-no-files-found: error

  sav-native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17-bookworm
        env:
          POSTGRES_USER: codex_test
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: codex_sav_ci
        ports:
          - 55473:5432
        options: >-
          --health-cmd "pg_isready -U codex_test -d codex_sav_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SAV_TEST_POSTGRES_URL: postgres://codex_test:synthetic-ci-only@127.0.0.1:55473/codex_sav_ci
      SAV_TEST_POSTGRES_TOKEN: '7300000000000000000000000000000000000000000000000000000000000086'
      SAV_ENCRYPTION_KEY_V1: synthetic-ci-only-encryption-key-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - run: npm ci --prefix studio
      - name: Mark isolated empty service
        working-directory: studio
        run: node --import tsx test/prepare-sav-native-ci.ts
      - name: Populated 0037 to 0039 with the real migrator twice
        working-directory: studio
        run: node --conditions=react-server --import tsx test/sav73-native-migration.ts
      - name: Native classification, invalidation, concurrent repair and durable opening
        working-directory: studio
        run: >-
          node node_modules/vitest/vitest.mjs run --maxWorkers=1 --no-file-parallelism
          src/lib/sav/intake/runtime.test.ts
          src/lib/sav/intake/execution.test.ts src/lib/sav/intake/console.test.ts
          src/lib/sav/intake/budget-profile.test.ts
          src/lib/sav/monitor.test.ts
          src/lib/sav/dashboard.test.ts
          src/lib/sav/dashboard-projection.test.ts
          src/lib/sav/dashboard-sql-reference.test.ts
          src/lib/sav/dashboard-projection-native.test.ts
          src/lib/sav/case-learning.test.ts
          src/lib/sav/navigation-commands.test.ts
          src/lib/sav/review-feedback.test.ts
          src/lib/sav/opened-email.test.ts
          src/app/studio/sav/open-email-actions.test.ts
      - name: Trigger privileges with a restricted synthetic role
        working-directory: studio
        run: node --import tsx test/sav73-native-role.ts
