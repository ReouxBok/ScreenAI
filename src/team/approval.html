<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Limova Team — votre accord</title>
  <link rel="stylesheet" href="team-pages.css">
</head>
<body class="approval">
  <main class="card" aria-labelledby="title">
    <div class="product"><span class="dot" id="productDot" aria-hidden="true"></span><span id="productLabel">Limova Team</span></div>
    <h1 id="title">Chargement…</h1>
    <p id="reason"></p>
    <dl id="lines"></dl>
    <div class="tabs" id="tabs" role="radiogroup" aria-labelledby="title" hidden></div>
    <p class="countdown" id="countdown" aria-live="polite"></p>
    <div class="actions">
      <button type="button" class="secondary" id="deny">Refuser</button>
      <button type="button" class="primary" id="approve" disabled>Autoriser</button>
    </div>
  </main>
  <script src="approval.js"></script>
</body>
</html>
